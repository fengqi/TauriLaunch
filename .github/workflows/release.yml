name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers (NSIS + MSI)
        run: npx tauri build --bundles nsis,msi

      - name: Build portable package
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exePath = "src-tauri\target\release\TauriLaunch.exe"
          if (!(Test-Path $exePath)) {
            throw "Portable EXE not found: $exePath"
          }
          $portableDir = "src-tauri\target\release\bundle\portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          $portableZip = Join-Path $portableDir ("TauriLaunch_" + $version + "_x64_portable.zip")
          if (Test-Path $portableZip) {
            Remove-Item $portableZip -Force
          }
          Compress-Archive -Path $exePath -DestinationPath $portableZip

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/portable/*.zip
